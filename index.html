<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>FUNAAB Student Registration</title>
                <link rel="stylesheet" href="style.css">
                </head>
                <body>
                    <div class="registration-container">
                            <!-- Logo and Header -->
                                    <div class="form-header">
                                                <img src="images/funaab-logo.png" alt="FUNAAB Logo" class="logo">
                                                            <h2>Federal University of Agriculture, Abeokuta</h2>
                                                                        <p>Fresh Students Portal — Account Activation & Registration</p>
                                                                                </div>

                                                                                        <!-- Registration Form -->
                                                                                                <form id="registrationForm">
                                                                                                            <!-- Full Name -->
                                                                                                                        <div class="form-group">
                                                                                                                                        <label for="fullName">Full Name (Surname First):</label>
                                                                                                                                                        <input type="text" id="fullName" placeholder="e.g., AKINWUNMI Olabisi John" required>
                                                                                                                                                                    </div>

                                                                                                                                                                                <!-- Matric Number -->
                                                                                                                                                                                            <div class="form-group">
                                                                                                                                                                                                            <label for="matricNo">Matric Number:</label>
                                                                                                                                                                                                                            <input type="text" id="matricNo" placeholder="e.g., 20243834" required>
                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                    <!-- Student Email -->
                                                                                                                                                                                                                                                                <div class="form-group">
                                                                                                                                                                                                                                                                                <label for="studentEmail">Student Email Address:</label>
                                                                                                                                                                                                                                                                                                <input type="email" id="studentEmail" placeholder="username@student.funaab.edu.ng" required>
                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                        <!-- Department Dropdown -->
                                                                                                                                                                                                                                                                                                                                    <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                    <label for="department">Department:</label>
                                                                                                                                                                                                                                                                                                                                                                    <select id="department" required>
                                                                                                                                                                                                                                                                                                                                                                                        <option value="">Select your department</option>
                                                                                                                                                                                                                                                                                                                                                                                                            <option value="ICT">Information and Communication Technology</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="IT">Information Technology</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="CS">Computer Science</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="DS">Data Science</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="IS">Information Systems</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="CY">Cyber Security</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="SE">Software Engineering</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Programme Dropdown -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label for="programme">Programme:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <select id="programme" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="">Select your programme</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="Full time">Full time</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="Weekly">Weekly</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="Weekend">Weekend</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- Password Fields -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="form-row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label for="password">Create Password:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="password" id="password" minlength="8" placeholder="Minimum 8 characters" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label for="confirmPassword">Confirm Password:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Terms Checklist -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="form-checkbox">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="checkbox" id="terms" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label for="terms">I confirm that my Bio-data entries align with my Admission details.</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- Submit Button -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button type="submit" class="submit-btn">Register</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Message UI Area -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="formMessage" class="message-box hidden"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
