<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>FUNAAB Student Registration Portal</title>
                <link rel="stylesheet" href="style.css">
                </head>
                <body>

                    <!-- Main Portal Wrapper Container -->
                        <main class="portal-container">
                                
                                        <!-- Semantic Header Section -->
                                                <header class="portal-header">
                                                            <img src="images/funaab-logo.png" alt="Federal University of Agriculture, Abeokuta official logo" class="institution-logo">
                                                                        <h1>Federal University of Agriculture, Abeokuta</h1>
                                                                                    <h2>Fresh Student Portal — Registration & Account Activation</h2>
                                                                                            </header>

                                                                                                    <!-- Main Form Section -->
                                                                                                            <section class="form-section">
                                                                                                                        <form id="registrationForm" aria-label="Student Registration Form">
                                                                                                                                        
                                                                                                                                                        <!-- Full Name Input Group -->
                                                                                                                                                                        <div class="form-control">
                                                                                                                                                                                            <label for="fullName">Full Name (Surname First):</label>
                                                                                                                                                                                                                <input type="text" id="fullName" placeholder="e.g., SMITH Alao Chukwuma" autocomplete="name" required>
                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                <!-- JAMB Registration Input Group -->
                                                                                                                                                                                                                                                                <div class="form-control">
                                                                                                                                                                                                                                                                                    <label for="jambNo">JAMB Registration Number:</label>
                                                                                                                                                                                                                                                                                                        <input type="text" id="jambNo" placeholder="e.g., 202612345678AB" pattern="[a-zA-Z0-9]+" required>
                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                        <!-- Official Student Email Input Group -->
                                                                                                                                                                                                                                                                                                                                                        <div class="form-control">
                                                                                                                                                                                                                                                                                                                                                                            <label for="studentEmail">Official Student Email Address:</label>
                                                                                                                                                                                                                                                                                                                                                                                                <input type="email" id="studentEmail" placeholder="username@student.funaab.edu.ng" required>
                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- College/Faculty Dropdown Selection -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="form-control">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label for="college">Academic College:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <select id="college" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="">-- Click to Select Your College --</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="COLAMR">COLAMR UD(Agricultural Management & Rural Development)</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="COLANIM">COLANIM (Animal Science & Livestock Production)</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="COLBIOS">COLBIOS (Biological Sciences)</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="COLENG">COLENG (Engineering)</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="COLERM">COLERM (Environmental Resources Management)</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="COLFHEC">COLFHEC (Food Science & Human Ecology)</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="COLPHYS">COLPHYS (Physical Sciences)</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="COLPLANT">COLPLANT (Plant Science & Crop Production)</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="COLVET">COLVET (Veterinary Medicine)</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Flexible Grid Row for Passwords -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="form-grid-row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="form-control">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label for="password">Create Password:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="password" id="password" minlength="8" placeholder="Minimum 8 characters" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="form-control">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label for="confirmPassword">Confirm Password:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Declaration Verification Checkbox -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="form-checkbox-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="checkbox" id="terms" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label for="terms">I verify that these entries match my official JAMB Admission profile details.</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Submission Control Button -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button type="submit" class="primary-submit-btn">Activate Profile Account</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- Dynamic Feedback Output Region -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="formFeedback" class="status-message hidden" role="alert"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
